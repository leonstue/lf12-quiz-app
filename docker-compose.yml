name: quiz-app

services:
  traefik:
    # Mindestens 3.6.1! Aeltere Versionen pinnen die Docker-API hart auf 1.24.
    # Docker Engine 29 hat die Mindestversion angehoben und lehnt das ab -- Traefik
    # liest dann KEINE Container-Labels, es entsteht kein einziger Router und
    # ausgeliefert wird nur das Traefik-Default-Zertifikat. Ab 3.6.1 handelt
    # Traefik die API-Version mit dem Daemon aus.
    image: ${TRAEFIK_IMAGE:-traefik:v3.6}
    container_name: quiz-app-traefik
    restart: unless-stopped
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=INFO
      - --accesslog=false
      # Dashboard und API bleiben aus -- nichts oeffentlich exponiert.
      - --api=false
      - --ping=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=quiz-app
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # HTTP -> HTTPS Redirect
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      # Let's Encrypt (HTTP-01 Challenge ueber den web-Entrypoint)
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL fehlt in .env}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    networks:
      - quiz-app
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 30s
      timeout: 5s
      retries: 3

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quiz-app:latest
    container_name: quiz-app-app
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
      HOST_BIND: '0.0.0.0'
      DOMAIN: ${DOMAIN:?DOMAIN fehlt in .env}
      HOST_SECRET: ${HOST_SECRET:?HOST_SECRET fehlt in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Quizze vom Host: neue oder geaenderte JSON-Dateien wirken ohne Rebuild.
      - ./quizzes:/app/quizzes:ro
    # Kein "ports"-Mapping: Der App-Port ist nur ueber Traefik erreichbar.
    expose:
      - '3000'
    networks:
      - quiz-app
    depends_on:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=quiz-app
      - traefik.http.routers.quiz-app.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.quiz-app.entrypoints=websecure
      - traefik.http.routers.quiz-app.tls=true
      - traefik.http.routers.quiz-app.tls.certresolver=letsencrypt
      - traefik.http.services.quiz-app.loadbalancer.server.port=3000
      # WebSocket/Socket.IO: Upgrade-Header und Forwarded-Header durchreichen.
      - traefik.http.middlewares.quiz-app-headers.headers.customrequestheaders.X-Forwarded-Proto=https
      - traefik.http.routers.quiz-app.middlewares=quiz-app-headers@docker

networks:
  quiz-app:
    name: quiz-app
    driver: bridge

volumes:
  # Wird von "make down" und "make clean" bewusst NICHT entfernt.
  letsencrypt:
    name: quiz-app-letsencrypt
