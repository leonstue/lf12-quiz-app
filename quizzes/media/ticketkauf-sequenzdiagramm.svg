<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="760" height="420" role="img"
     aria-label="Sequenzdiagramm eines Ticketkaufs zwischen Fahrgast, SmartCity-App, PayPal und Ticket-Service">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #eef2ff; stroke: #4338ca; stroke-width: 1.5; }
    .box-label { font: 600 13px system-ui, sans-serif; fill: #1e1b4b; text-anchor: middle; }
    .lifeline { stroke: #6366f1; stroke-width: 1.2; stroke-dasharray: 5 5; }
    .exec { fill: #c7d2fe; stroke: #4338ca; stroke-width: 1; }
    .msg { stroke: #0f172a; stroke-width: 1.6; }
    .reply { stroke: #0f172a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .msg-label { font: 12px system-ui, sans-serif; fill: #0f172a; }
    .frame { fill: none; stroke: #64748b; stroke-width: 1.2; }
    .frame-tag { fill: #e2e8f0; stroke: #64748b; stroke-width: 1.2; }
    .frame-text { font: 600 11px system-ui, sans-serif; fill: #334155; }
    .guard { font: italic 11px system-ui, sans-serif; fill: #475569; }
  </style>

  <rect class="bg" x="0" y="0" width="760" height="420" />

  <defs>
    <marker id="filled" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0f172a" />
    </marker>
    <marker id="open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10" fill="none" stroke="#0f172a" stroke-width="1.4" />
    </marker>
  </defs>

  <!-- Teilnehmer -->
  <rect class="box" x="30" y="20" width="120" height="34" rx="4" />
  <text class="box-label" x="90" y="42">Fahrgast</text>
  <rect class="box" x="220" y="20" width="140" height="34" rx="4" />
  <text class="box-label" x="290" y="42">SmartCity-App</text>
  <rect class="box" x="430" y="20" width="110" height="34" rx="4" />
  <text class="box-label" x="485" y="42">PayPal</text>
  <rect class="box" x="600" y="20" width="130" height="34" rx="4" />
  <text class="box-label" x="665" y="42">Ticket-Service</text>

  <!-- Lifelines -->
  <line class="lifeline" x1="90" y1="54" x2="90" y2="400" />
  <line class="lifeline" x1="290" y1="54" x2="290" y2="400" />
  <line class="lifeline" x1="485" y1="54" x2="485" y2="400" />
  <line class="lifeline" x1="665" y1="54" x2="665" y2="400" />

  <!-- Aktivierungsbalken -->
  <rect class="exec" x="84" y="80" width="12" height="270" />
  <rect class="exec" x="284" y="92" width="12" height="248" />
  <rect class="exec" x="479" y="150" width="12" height="60" />
  <rect class="exec" x="659" y="270" width="12" height="55" />

  <!-- Nachrichten -->
  <line class="msg" x1="96" y1="92" x2="278" y2="92" marker-end="url(#filled)" />
  <text class="msg-label" x="110" y="86">streckeWaehlen()</text>

  <line class="reply" x1="278" y1="126" x2="96" y2="126" marker-end="url(#open)" />
  <text class="msg-label" x="122" y="120">preis</text>

  <!-- alt-Fragment -->
  <rect class="frame" x="60" y="140" width="640" height="200" />
  <path class="frame-tag" d="M60 140 h58 v16 l-10 10 H60 z" />
  <text class="frame-text" x="70" y="153">alt</text>
  <text class="guard" x="128" y="153">[Zahlung erfolgreich]</text>

  <line class="msg" x1="296" y1="170" x2="473" y2="170" marker-end="url(#filled)" />
  <text class="msg-label" x="320" y="164">zahlungAusloesen()</text>

  <line class="reply" x1="473" y1="204" x2="296" y2="204" marker-end="url(#open)" />
  <text class="msg-label" x="352" y="198">bestaetigt</text>

  <line class="frame" x1="60" y1="240" x2="700" y2="240" stroke-dasharray="6 4" />
  <text class="guard" x="70" y="256">[sonst]</text>

  <line class="msg" x1="296" y1="284" x2="653" y2="284" marker-end="url(#open)" />
  <text class="msg-label" x="360" y="278">kaufAbbrechen()</text>

  <line class="reply" x1="653" y1="318" x2="296" y2="318" marker-end="url(#open)" />
  <text class="msg-label" x="400" y="312">abgebrochen</text>

  <!-- Abschluss -->
  <line class="reply" x1="278" y1="368" x2="96" y2="368" marker-end="url(#open)" />
  <text class="msg-label" x="120" y="362">ergebnisAnzeigen()</text>
</svg>
